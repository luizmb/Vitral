name: VitralGallery

options:
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: lu.ios

packages:
  Vitral:
    path: ..
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.6

targets:
  Gallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # The Gallery shows every wallpaper, so it takes them all; another app copies only its own.
      - path: ../Wallpapers/Images
        buildPhase: resources
    dependencies:
      - package: Vitral
        product: Vitral
    # Signing comes from the xcconfig (team, style), so the release jobs can override it.
    configFiles:
      Debug: Config/Shared.xcconfig
      Release: Config/Shared.xcconfig
    # Each sample's ⓘ shows its code, copied out of the pages before every build so it can't drift.
    # A clean environment, because the build's (an iOS SDK) would make the script compile for iOS.
    preBuildScripts:
      - name: Extract sample code
        script: |
          cd "$SRCROOT/.." && env -i PATH="$PATH" HOME="$HOME" xcrun --sdk macosx swift Gallery/Scripts/ExtractSamples.swift .
        basedOnDependencyAnalysis: false
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # XcodeGen's iOS preset sets "iPhone Developer" here, which would beat the xcconfig's
        # identity; inheriting hands the choice back to Shared.xcconfig / Local.xcconfig.
        CODE_SIGN_IDENTITY: $(inherited)
        PRODUCT_BUNDLE_IDENTIFIER: lu.ios.vitral.gallery
        # App Store Connect rejects names another app already has (ITMS-90129): "Gallery" and
        # "Vitral" both are. The module stays Gallery, so the code and tests don't change.
        PRODUCT_NAME: VitralGallery
        PRODUCT_MODULE_NAME: Gallery
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitral Gallery
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # TestFlight asks: the Gallery uses no encryption beyond the system's.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  # Hosted in the Gallery app: glass only renders in a real window, which a package test target
  # doesn't have.
  GallerySnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "__Snapshots__/**"
    dependencies:
      - target: Gallery
      - package: Vitral
        product: Vitral
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VitralGallery.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VitralGallery"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: ""

schemes:
  Gallery:
    build:
      targets:
        Gallery: all
    test:
      targets:
        - GallerySnapshotTests
